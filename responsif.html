<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar Responsif HTML</title>
  <style>
    h1 {
      color: black;
      text-align: center;
    }

    @media screen and (max-width: 600px) {
      h1 {
        color: red;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <h1>Coba kecilkan jendela browsermu!</h1>
</body>
</html>
